        body{
            height: 100vh;

            display: flex;

            align-items: center;
        }

        table{
            border-collapse: collapse;
        }

        table,th,td{
            border:1px solid black;
        }

        thead{
            background-color: #c1c1c1;
        }

        tr:nth-of-type(even){
            background-color: #f1f1f1;
        }

        tr:hover{
            background-color: #b3b3b3;
        }

        tr,td{
            width: 50px;
            height: 50px;
            padding: 5px 20px;
        }

        tbody tr td:nth-of-type(2){

        }

</head>
