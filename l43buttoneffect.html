<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Fontawesome CDNJS link 5.15.4 -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
            integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <title>Button Effect</title>
        <style type="text/css">
            body {
                font-family: sans-serif;
                height: 100vh;

                display: flex;
                justify-content: center;
                align-items: center;
            }

            .btn {
                background: none;
                color: #fff;
                font-weight: 700;
                width: 300px;

                letter-spacing: 1px;
                text-transform: uppercase;

                border: none;
                padding: 25px 18px;
                margin: 0 20px;

                cursor: pointer;

                position: relative;
            }

            .download-btn {
                background-color: steelblue;
            }

            .upload-btn {
                background-color: violet;
            }

            .btn::before {
                content: "";
                font-family: "Font Awesome 5 Free";

                width: 60px;
                height: 100%;
                /* background-color: green; */
                font-size: 150%;
                line-height: 3;

                position: absolute;
                left: 0;
                top: 0;
            }

            .download-btn::before {
                content: "\f019";
                background-color: skyblue;
            }

            .upload-btn::before {
                content: "\f093";
                background-color: skyblue;
            }

            .download-btn:hover {
                background-color: deepskyblue;
            }

            .upload-btn:hover {
                background-color: royalblue;
            }

            .download-btn:active {
                background-color: mediumslateblue;
            }

            .upload-btn:active {
                background-color: darkviolet;
            }
        </style>
    </head>
    <body>
        <button type="button" class="btn download-btn">Download Button</button>
        <button type="button" class="btn upload-btn">Upload Button</button>
    </body>
</html>
