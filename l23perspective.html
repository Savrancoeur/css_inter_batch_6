<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Perspective</title>
        <style>
            * {
                perspective: 500px;
            }
            body {
                height: 100vh;

                display: grid;
                place-items: center;
            }

            .container {
                /* perspective: 500px; */
            }

            .container img {
                width: 300px;

                transition: transform 2s linear;
            }

            .container img:hover {
                /* transform: translateZ(300px); */
                transform: translateZ(-300px);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img
                src="../../HIT/Images&Logos/genshin-arlecchino-drip-marketing.webp"
                alt="yelan"
            />
        </div>
    </body>
</html>
